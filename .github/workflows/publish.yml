name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Check whether this version is already published
        id: check
        run: |
          node=$(sed -n 's/^name = "\(.*\)"/\1/p' pyproject.toml | head -1)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          echo "Declared: $node $version"
          if curl -fsS "https://api.comfy.org/nodes/$node/versions/$version" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$node $version is already on the registry, nothing to publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Custom Node
        if: steps.check.outputs.published == 'false'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        env:
          COMFY_NODE_CHANGELOG: "Repeat run button: after every finished run the request is sent back into the chat and the new answer is run, until you stop it."
